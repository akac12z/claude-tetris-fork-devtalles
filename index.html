<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">tetris</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section">
          <button id="skin-btn" class="theme-toggle">Skin: Retro</button>
        </div>

        <div class="panel-section">
          <button id="theme-toggle" class="theme-toggle">&#9728; Light</button>
        </div>

        <div class="panel-section" id="leaderboard-panel">
          <span class="label">BEST SCORES</span>
          <div id="leaderboard-list"><!-- populated by JS --></div>
          <button id="reset-scores" class="reset-scores-btn">Reset Records</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <!-- Pause menu -->
      <div id="pause-menu" class="overlay-box hidden">
        <p class="overlay-title-pause">PAUSA</p>
        <button id="resume-btn" class="menu-btn">Resume</button>
        <button id="restart-pause-btn" class="menu-btn">Restart</button>
        <div class="start-level-row">
          <label for="start-level-select">Starting Level</label>
          <select id="start-level-select">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </div>
        <div class="pause-controls">
          <span class="label">CONTROLS</span>
          <ul class="pause-controls-list">
            <li><kbd>←</kbd><kbd>→</kbd> <span>move</span></li>
            <li><kbd>↓</kbd> <span>soft drop</span></li>
            <li><kbd>Space</kbd> <span>hard drop</span></li>
            <li><kbd>↑</kbd><kbd>X</kbd> <span>rotate</span></li>
            <li><kbd>P</kbd><kbd>Esc</kbd> <span>pause</span></li>
          </ul>
        </div>
      </div>
      <!-- Game over panel -->
      <div id="gameover-panel" class="overlay-box hidden">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn" class="menu-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    (function () {
      const btn = document.getElementById('theme-toggle');
      const saved = localStorage.getItem('tetris-theme') || 'dark';
      if (saved === 'light') {
        document.body.classList.add('light');
        btn.textContent = '☾ Dark';
      }
      btn.addEventListener('click', function () {
        const isLight = document.body.classList.toggle('light');
        btn.textContent = isLight ? '☾ Dark' : '☀ Light';
        localStorage.setItem('tetris-theme', isLight ? 'light' : 'dark');
      });
    })();
  </script>
</body>
</html>
